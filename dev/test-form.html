<!DOCTYPE html><html><head><title>Apply to Rocket Accelerator</title><meta charset="utf-8"><style>
body { font: 15px/1.5 -apple-system, system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 32px 20px 60px; color: #1c2030; }
h1 { font-size: 24px; }
label { display: block; font-weight: 600; margin: 18px 0 6px; }
input[type=text], input[type=url], textarea, select { width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1.5px solid #d5d9e2; border-radius: 8px; font: inherit; }
fieldset { border: 1.5px solid #d5d9e2; border-radius: 8px; margin: 18px 0; padding: 10px 14px; }
legend { font-weight: 600; padding: 0 6px; }
fieldset label { display: inline-flex; align-items: center; gap: 6px; font-weight: 400; margin: 4px 16px 4px 0; }
button { margin-top: 20px; padding: 10px 18px; border: none; border-radius: 8px; background: #1c2030; color: #fff; font: 600 14px system-ui; }
</style></head><body>
<h1>Rocket Accelerator — Winter 2027 Cohort Application</h1>
<form>
<label>What does your company do?</label><textarea></textarea>
<label>What is your traction so far? (MRR, paying customers)</label><textarea></textarea>
<label>Who are your co-founders and how did you meet?</label><textarea></textarea>
<label>How much are you raising this seed round?</label><input type="text">
<label>Why do you want to join our accelerator?</label><textarea></textarea>
<label>Drop a link to your latest deck</label><input type="url">
<label>Where can we find you online?</label><input type="url">
<label>What stage are you at?</label>
<select><option value="">Select…</option><option>Idea</option><option>Pre-seed</option><option>Seed</option><option>Series A</option></select>
<fieldset><legend>Are you incorporated?</legend>
<label><input type="radio" name="inc" value="yes">Yes</label>
<label><input type="radio" name="inc" value="no">No</label></fieldset>
<fieldset><legend>How did you hear about us?</legend>
<label><input type="radio" name="hear" value="tw">Twitter</label>
<label><input type="radio" name="hear" value="fr">A friend</label></fieldset>
<button type="submit">Submit application</button>
</form></body></html>
